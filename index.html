<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>SV13 Duel Hub</title>
  <link rel="stylesheet" href="styles/hub.css" />
  <style>
    /* tiny style just for the audio toggle */
    .audio-toggle {
      position: fixed;
      left: 16px;
      bottom: 16px;
      z-index: 9999;
      background: rgba(0,0,0,0.65);
      color: #fff;
      border: 1px solid #00ffff;
      border-radius: 999px;
      padding: 8px 12px;
      font-size: 12px;
      cursor: pointer;
      user-select: none;
      backdrop-filter: blur(2px);
    }
    .audio-toggle:hover { box-shadow: 0 0 10px #00ffff; }
  </style>
</head>
<body>
  <!-- ❄️ Snowfall Effect -->
  <div class="snow-effect"></div>

  <div id="background"></div>

  <!-- 🔗 Discord Logo Button -->
  <a class="discord-button" href="https://discord.com/channels/1166441420643639348" target="_blank" rel="noopener">
    <img src="images/logos/discord_logo.PNG" alt="Discord" />
  </a>

  <div class="overlay">
    <h1 id="hub-title">SV13<br>DUEL BOT</h1>
    <p class="subtitle">WELCOME BACK, SURVIVOR.<br>PREPARE YOUR DECK. DOMINATE THE ZONE.</p>

    <div class="button-wrapper">
      <div class="button-grid">
        <!-- ✅ Updated to Rulebook-UI (+ cache-bust) and marked to pass token/api -->
        <a href="https://madv313.github.io/Rulebook-UI/?v=rb-2025-10-16a" class="menu-button sv13-link" data-pass-params id="rulebook-link">
          Rulebook
        </a>

        <a href="https://madv313.github.io/Card-Collection-UI/" class="menu-button sv13-link" id="view-collection" data-pass-params>
          View Collection
        </a>

        <a href="https://madv313.github.io/Deck-Builder-UI/" class="menu-button sv13-link" id="build-deck" data-pass-params>
          Build/Edit Deck
        </a>

        <!-- Default to practice mode; hubEnhancements.js appends token & api -->
        <a href="https://madv313.github.io/Duel-UI/?mode=practice" class="menu-button sv13-link" id="start-duel" data-pass-params>
          Start a Duel
        </a>

        <a href="https://madv313.github.io/Leaderboard-UI/" class="menu-button sv13-link" id="leaderboard" data-pass-params>
          Leaderboard
        </a>
      </div>
    </div>
  </div>

  <!-- 🧩 Stat Labels (Bottom Left) -->
  <div class="stat-overlay">
    <div class="stat-line">ARSENAL UNLOCKED:</div>
    <div class="stat-line">BANKED COINS:</div>
  </div>

  <!-- 🔢 Stat Values (Bottom Right) -->
  <div class="stat-values">
    <div class="stat-line"><span id="arsenalCount">30 / 127</span></div>
    <div class="stat-line"><span id="coinCount">13</span></div>
  </div>

  <!-- 🔊 Background music (surviving_chernarus.mp3) -->
  <audio
    id="hub-bgm"
    src="audio/bg/surviving_chernarus.mp3"
    autoplay
    muted
    playsinline
    loop
    preload="auto"></audio>
  <button id="audioToggle" class="audio-toggle" aria-label="Mute background music">🔇</button>

  <!-- 💡 Minimal, safe param forwarder for Rulebook -->
  <script>
  (function() {
    try {
      const qs = new URLSearchParams(location.search);
      const tokenFromUrl = (qs.get('token') || '').trim();
      const apiFromUrl   = (qs.get('api') || '').replace(/\/+$/, '');

      // prefer URL; fall back to localStorage (shared keys with other UIs)
      let token = tokenFromUrl || localStorage.getItem('sv13.token') || '';
      let api   = apiFromUrl   || localStorage.getItem('sv13.api')   || '';

      // persist back if URL had fresh values
      if (tokenFromUrl) localStorage.setItem('sv13.token', tokenFromUrl);
      if (apiFromUrl)   localStorage.setItem('sv13.api', apiFromUrl);

      const link = document.getElementById('rulebook-link');
      if (link) {
        const u = new URL(link.href);
        if (token) u.searchParams.set('token', token);
        if (api)   u.searchParams.set('api', api);
        link.href = u.toString();

        // mark for downstream UIs that auto-chain params
        link.classList.add('sv13-link');
        link.setAttribute('data-pass-params', '');
      }
    } catch (e) {
      /* no-op: never block the hub */
      console.warn('[hub] rulebook param patch skipped:', e?.message || e);
    }
  })();
  </script>

  <!-- Main enhancements: token/api propagation + stats + BG music control -->
  <script type="module" src="scripts/hubEnhancements.js"></script>
</body>
</html>
